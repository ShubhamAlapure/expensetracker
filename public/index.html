<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ledgerly Expense Tracker</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </symbol>
      <symbol id="icon-save" viewBox="0 0 24 24">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
        <path d="M17 21v-8H7v8M7 3v5h8"/>
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24">
        <path d="m12 20 9-9-4-4-9 9-2 6 6-2Z"/>
        <path d="m15 6 4 4"/>
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>
        <path d="M10 11v6M14 11v6"/>
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-4-4"/>
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 3v12"/>
        <path d="m7 10 5 5 5-5"/>
        <path d="M5 21h14"/>
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 0 1-15.5 6.2"/>
        <path d="M3 12A9 9 0 0 1 18.5 5.8"/>
        <path d="M18 2v4h4M2 18h4v4"/>
      </symbol>
      <symbol id="icon-wallet" viewBox="0 0 24 24">
        <path d="M3 7a3 3 0 0 1 3-3h13v16H6a3 3 0 0 1-3-3Z"/>
        <path d="M16 12h5v5h-5a2.5 2.5 0 0 1 0-5Z"/>
      </symbol>
      <symbol id="icon-filter" viewBox="0 0 24 24">
        <path d="M4 5h16l-6 7v5l-4 2v-7Z"/>
      </symbol>
    </svg>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg><use href="#icon-wallet"></use></svg>
          </span>
          <div>
            <p class="eyebrow">Expense Tracker</p>
            <h1>Ledgerly</h1>
          </div>
        </div>

        <div class="topbar-actions" aria-label="Dashboard controls">
          <label class="field compact">
            <span>Month</span>
            <input id="monthFilter" type="month">
          </label>
          <button id="refreshButton" class="icon-button ghost" type="button" title="Refresh data" aria-label="Refresh data">
            <svg><use href="#icon-refresh"></use></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="summary-grid" aria-label="Monthly summary">
          <article class="metric-card balance-card">
            <span>Balance</span>
            <strong id="balanceValue">$0.00</strong>
            <small id="savingsRate">0% saved</small>
          </article>
          <article class="metric-card">
            <span>Income</span>
            <strong id="incomeValue">$0.00</strong>
            <small id="incomeCount">0 entries</small>
          </article>
          <article class="metric-card">
            <span>Expenses</span>
            <strong id="expenseValue">$0.00</strong>
            <small id="expenseCount">0 entries</small>
          </article>
          <article class="metric-card budget-meter">
            <span>Budget Left</span>
            <strong id="budgetLeftValue">$0.00</strong>
            <div class="progress-track" aria-hidden="true">
              <div id="budgetProgress" class="progress-fill"></div>
            </div>
          </article>
        </section>

        <section class="workspace-grid">
          <div class="left-column">
            <section class="panel transaction-panel">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">Entry</p>
                  <h2 id="formTitle">Add Transaction</h2>
                </div>
                <button id="clearEditButton" class="icon-button ghost hidden" type="button" title="Cancel edit" aria-label="Cancel edit">
                  <svg><use href="#icon-refresh"></use></svg>
                </button>
              </div>

              <form id="transactionForm" class="transaction-form">
                <input id="transactionId" type="hidden">

                <div class="segmented-control" role="radiogroup" aria-label="Transaction type">
                  <label>
                    <input type="radio" name="type" value="expense" checked>
                    <span>Expense</span>
                  </label>
                  <label>
                    <input type="radio" name="type" value="income">
                    <span>Income</span>
                  </label>
                </div>

                <label class="field">
                  <span>Title</span>
                  <input id="titleInput" name="title" type="text" placeholder="Coffee, rent, invoice" required>
                </label>

                <div class="form-row">
                  <label class="field">
                    <span>Amount</span>
                    <input id="amountInput" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
                  </label>
                  <label class="field">
                    <span>Date</span>
                    <input id="dateInput" name="date" type="date" required>
                  </label>
                </div>

                <div class="form-row">
                  <label class="field">
                    <span>Category</span>
                    <input id="categoryInput" name="category" list="categoryList" placeholder="Food" required>
                    <datalist id="categoryList"></datalist>
                  </label>
                  <label class="field">
                    <span>Account</span>
                    <input id="accountInput" name="account" list="accountList" placeholder="Checking">
                    <datalist id="accountList"></datalist>
                  </label>
                </div>

                <label class="field">
                  <span>Notes</span>
                  <textarea id="notesInput" name="notes" rows="3" placeholder="Optional details"></textarea>
                </label>

                <div class="form-actions">
                  <button class="primary-button" type="submit">
                    <svg><use href="#icon-save"></use></svg>
                    <span id="submitLabel">Save</span>
                  </button>
                  <button id="resetButton" class="secondary-button" type="reset">Reset</button>
                </div>
              </form>
            </section>

            <section class="panel budget-panel">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">Planning</p>
                  <h2>Budget</h2>
                </div>
                <button id="saveSettingsButton" class="icon-button" type="button" title="Save budget" aria-label="Save budget">
                  <svg><use href="#icon-save"></use></svg>
                </button>
              </div>

              <div class="budget-grid">
                <label class="field">
                  <span>Currency</span>
                  <input id="currencyInput" type="text" maxlength="3" value="INR">
                </label>
                <label class="field">
                  <span>Monthly Budget</span>
                  <input id="monthlyBudgetInput" type="number" min="0" step="1">
                </label>
              </div>

              <div id="categoryBudgetList" class="budget-list" aria-label="Category budgets"></div>
            </section>
          </div>

          <div class="right-column">
            <section class="panel insight-panel">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">Overview</p>
                  <h2>Spending Mix</h2>
                </div>
                <span id="monthLabel" class="soft-pill">This month</span>
              </div>

              <div class="insight-layout">
                <div class="donut-wrap">
                  <div id="donutChart" class="donut-chart" role="img" aria-label="Category spending chart"></div>
                  <div class="donut-center">
                    <span>Total</span>
                    <strong id="donutTotal">$0</strong>
                  </div>
                </div>
                <div id="categoryBreakdown" class="category-breakdown"></div>
              </div>

              <div class="trend-block">
                <div class="trend-heading">
                  <span>Daily Spending</span>
                  <strong id="trendPeak">$0 peak</strong>
                </div>
                <svg id="trendChart" class="trend-chart" viewBox="0 0 640 130" preserveAspectRatio="none" aria-label="Daily spending trend"></svg>
              </div>
            </section>

            <section class="panel transactions-panel">
              <div class="panel-heading transactions-heading">
                <div>
                  <p class="eyebrow">Ledger</p>
                  <h2>Transactions</h2>
                </div>
                <button id="exportButton" class="icon-button" type="button" title="Export CSV" aria-label="Export CSV">
                  <svg><use href="#icon-download"></use></svg>
                </button>
              </div>

              <div class="filters">
                <label class="search-field">
                  <svg><use href="#icon-search"></use></svg>
                  <input id="searchInput" type="search" placeholder="Search">
                </label>
                <label class="field compact">
                  <span>Type</span>
                  <select id="typeFilter">
                    <option value="all">All</option>
                    <option value="expense">Expenses</option>
                    <option value="income">Income</option>
                  </select>
                </label>
                <label class="field compact">
                  <span>Category</span>
                  <select id="categoryFilter">
                    <option value="all">All</option>
                  </select>
                </label>
              </div>

              <div id="transactionList" class="transaction-list" aria-live="polite"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/app.js" defer></script>
  </body>
</html>
